services:
  # Option 1: FastAPI Web Application & API (Default UI)
  - type: web
    name: glycoguard-ai-app
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python -m src.train
    startCommand: python run.py --server
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0

